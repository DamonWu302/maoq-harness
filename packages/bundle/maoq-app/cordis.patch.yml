# MAOQ policy layer over the base browser profile.

- id: system-prompt
  config:
    persona: >-
      You are the MAOQ commander. Seek truth from current evidence, identify the principal
      contradiction, and concentrate analysis on the market direction with the least
      resistance. Choose the smallest sufficient specialist council for each decision;
      do not invoke every specialist by habit. Distinguish strategic posture from tactical
      opportunity, expose counter-evidence and invalidation conditions, and prefer no trade
      when the evidence is inadequate. The independent risk reviewer has final veto power.
      You may produce research and paper-trading decisions only. Never place live orders,
      weaken risk limits, move the market-data cutoff, or modify production strategy code.

# The browser layer disables the general workflow tools and their engine. MAOQ
# keeps those model-facing tools hidden, but its fixed decision workflow still
# needs the host-plane engine behind `maoq_decide`.
- id: workflow-worker-thread
  disabled: false

# Register the ChatGPT-backed Codex route for the commander while preserving
# every API-key provider from the base profile. The optional credential bridge
# reads the existing local Codex login only for this route.
- id: llm-pi-ai
  config:
    reuseCodexLogin: true
    providers:
      openai-codex: {}

# Replace generic technical tool rows with MAOQ business-language cards.
- insert:
    - id: ui-maoq-tools
      name: '@deepseek-ai/dsh-client-ui-maoq-tools'

- insert:
    - id: market-snapshot
      name: '@deepseek-ai/dsh-market-snapshot'
      config:
        root: .maoq/snapshots

    - id: market-snapshot-json
      name: '@deepseek-ai/dsh-market-snapshot-json'
      config:
        root: .maoq/imports

    - id: market-tactic-lab
      name: '@deepseek-ai/dsh-market-tactic-lab'

    - id: market-snapshot-mysql
      name: '@deepseek-ai/dsh-market-snapshot-mysql'
      config:
        host: !!js process.env.MAOQ_MYSQL_HOST ?? '127.0.0.1'
        port: !!js Number(process.env.MAOQ_MYSQL_PORT ?? 3306)
        socketPath: !!js process.env.MAOQ_MYSQL_SOCKET
        user: !!js process.env.MAOQ_MYSQL_USER ?? 'root'
        database: !!js process.env.MAOQ_MYSQL_DATABASE ?? 'long_short_stock'
        passwordEnv: !!js process.env.MAOQ_MYSQL_PASSWORD_CREDENTIAL

    - id: market-news-web
      name: '@deepseek-ai/dsh-market-news-web'
      config:
        root: .maoq/news

    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        model: gpt-5.6-luna
        reasoningEffort: low
        responsesTransport: http
        permissionMode: never

    - id: tool-maoq-decision
      name: '@deepseek-ai/dsh-tool-maoq-decision'
      config:
        subagentProvider: codex
        analysisMode: quick
        maxSpecialists: 4
        maxResultChars: 32768
        stateRoot: .maoq/decisions
        tacticStateRoot: .maoq/tactics
        maxStateFiles: 500
        maxTacticStateFiles: 500
        maxSnapshotFiles: 500
        dailyStateMaximumAgeHours: 24
        autoDailyRefresh: true
        dailyRefreshTime: '19:15'
        dailyRefreshRetryMinutes: 15
        dailyRefreshWindowMinutes: 120

    - id: tool-maoq-snapshot
      name: '@deepseek-ai/dsh-tool-maoq-snapshot'
      config:
        allowedAdapters:
          - long-short-stock-mysql
        maxGenerateCount: 10
        maxListCount: 20
        maxScanFiles: 500
        generateTimeoutMs: 600000

    - id: tool-maoq-tactic-research
      name: '@deepseek-ai/dsh-tool-maoq-tactic-research'
      config:
        allowedAdapters:
          - long-short-stock-history-mysql
        minimumStocks: 3000
        chunkSessions: 30
        maxRangeDays: 1827
        evaluationTimeoutMs: 900000
        recentSignalLimit: 10
