# Keyless full Loader composition for the minimum MAOQ decision path.
- id: mock-maoq-runtime
  name: './mock-maoq-runtime.ts'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: fresh

- id: tool-maoq-decision
  name: '@deepseek-ai/dsh-tool-maoq-decision'
  config:
    subagentProvider: fresh
    maxSpecialists: 3

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: commander
        provider: mock
        model: maoq-commander
        cwd: !!js process.cwd()
    persona: 'Exercise the MAOQ structured decision path without network access.'
    workspaceContext: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
